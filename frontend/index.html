<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TollRail402 — Agentic Payment Rails on Algorand</title>
  <meta name="description" content="Autonomous AI agent API payments using HTTP 402, Ed25519 signatures, and Algorand TestNet USDC." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <!-- Deep Pine-Emerald Sidebar -->
    <aside id="sidebar" class="sidebar" aria-label="Primary navigation">
      <div class="sidebar-logo-area">
        <a href="#overview" class="sidebar-logo-link" data-nav="overview" aria-label="TollRail402 Home">
          <svg width="38" height="38" viewBox="0 0 40 40" fill="none" aria-hidden="true">
            <path d="M20 5L8 34H14.2L20 19.6L25.8 34H32L20 5Z" fill="#10B981"/>
            <path d="M13 28.5L27 21.5" stroke="#052B22" stroke-width="3.2" stroke-linecap="round"/>
            <path d="M20 5L29.5 27.5" stroke="#34D399" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </a>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item active" data-page="overview">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5.5v-6.5h-5V21H4a1 1 0 0 1-1-1v-9.5z" stroke-linejoin="round"/></svg>
          <span>Dashboard</span>
        </button>
        <button class="nav-item" data-page="agents">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>Agent Management</span>
        </button>
        <button class="nav-item" data-page="marketplace">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 9l2-5h14l2 5M3 9v11a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V9M3 9h18M9 21V13h6v8" stroke-linejoin="round"/></svg>
          <span>API Marketplace</span>
        </button>
        <button class="nav-item" data-page="activity">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M22 12h-4l-3 9L9 3l-3 9H2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Payment Activity</span>
        </button>
        <button class="nav-item" data-page="channels">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
          <span>Payment Channels</span>
        </button>
        <button class="nav-item" data-page="policies">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M12 8v8M9.5 10.5c0-1 1.1-1.5 2.5-1.5s2.5.5 2.5 1.5-1.1 1.5-2.5 1.5-2.5.5-2.5 1.5 1.1 1.5 2.5 1.5 2.5-.5 2.5-1.5" stroke-linecap="round"/></svg>
          <span>Spending Policies</span>
        </button>
        <button class="nav-item" data-page="explorer">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35" stroke-linecap="round"/></svg>
          <span>Transaction Explorer</span>
        </button>
        <button class="nav-item" data-page="audit">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5" stroke-linecap="round"/></svg>
          <span>Audit Logs</span>
        </button>
        <button class="nav-item" data-page="demo">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><polygon points="6 4 20 12 6 20 6 4" stroke-linejoin="round"/></svg>
          <span>Live 402 Demo</span>
        </button>
        <button class="nav-item" data-page="docs">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          <span>Documentation</span>
        </button>
        <button class="nav-item" data-page="settings">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.79 1 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Settings</span>
        </button>
      </nav>

      <div class="sidebar-bottom">
        <div class="sidebar-status-card" id="sidebar-status-card">
          <div class="status-card-top">
            <span class="telemetry-dot" id="sidebar-net-dot"></span>
            <span class="status-card-title">Network Status</span>
          </div>
          <div class="status-card-network">Algorand TestNet</div>
          <div class="status-card-state" id="sidebar-net-state">Connecting...</div>
        </div>

        <button class="sidebar-promo-card" id="sidebar-demo-promo" type="button">
          <div class="promo-copy">
            <div class="promo-title">Autonomous<br/>Payments. Made Easy.</div>
            <div class="promo-link">Try 402 Demo →</div>
          </div>
          <svg class="promo-bot" width="46" height="46" viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <rect x="10" y="14" width="28" height="22" rx="7" fill="#E6F4EE"/>
            <rect x="14" y="19" width="20" height="10" rx="4" fill="#062B22"/>
            <circle cx="20" cy="24" r="2.2" fill="#34D399"/>
            <circle cx="28" cy="24" r="2.2" fill="#34D399"/>
            <path d="M24 8v6M18 36v5M30 36v5" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </aside>

    <!-- Main Workspace Viewport -->
    <div class="main-area">
      <!-- White Header Bar -->
      <header class="topbar">
        <div class="topbar-left">
          <button id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Toggle menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round"/>
            </svg>
          </button>
          <div class="brand-lockup">
            <div class="brand-tile">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 3L4.5 20H8.5L12 11.8L15.5 20H19.5L12 3Z" fill="#FFFFFF"/>
              </svg>
            </div>
            <div class="brand-copy">
              <div class="brand-title">TollRail402</div>
              <div class="brand-sub">Agentic Payment Rails on Algorand</div>
            </div>
          </div>
        </div>

        <div class="topbar-right">
          <button id="topbar-mode-chip" class="chip-network" type="button" title="Switch mode in Settings">
            <span class="chip-dot" id="topbar-mode-dot"></span>
            <span id="topbar-mode-label">Local Demo</span>
          </button>

          <button id="topbar-wallet-chip" class="chip-wallet mono" type="button" title="Copy Merchant Recipient Address">
            <span id="topbar-wallet-short">Loading...</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <rect x="9" y="9" width="13" height="13" rx="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
          </button>

          <button id="topbar-demo-btn" class="avatar-btn" type="button" title="Launch Live 402 Demo">TR</button>
        </div>
      </header>

      <!-- Dynamic Page Container -->
      <main id="page-content" class="page-content" tabindex="-1">
        <div class="loading-state">Loading TollRail402 workspace...</div>
      </main>
    </div>
  </div>

  <!-- Slide-over Detail Drawer -->
  <div id="drawer-backdrop" class="drawer-backdrop hidden" aria-hidden="true"></div>
  <aside id="detail-drawer" class="detail-drawer hidden" aria-label="Detail inspector">
    <div class="drawer-header">
      <h2 id="drawer-title" class="drawer-title">Details</h2>
      <button id="drawer-close-btn" class="btn btn-ghost btn-sm" aria-label="Close drawer">Close</button>
    </div>
    <div id="drawer-body" class="drawer-body"></div>
  </aside>

  <!-- Toast Notification Region -->
  <div id="toast-region" class="toast-region" aria-live="polite"></div>

  <script src="/js/api.js"></script>
  <script src="/js/charts.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
